name: Isolated Android Device QA
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional successful App builds run for exact signed APK testing
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, Nexus 10]
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed candidate provenance
        if: inputs.candidate_run_id != ''
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.payload.inputs.candidate_run_id
            });
            if (run.head_branch !== 'codex/ingredient-apple-simulator-qa-20261015' ||
                run.path !== '.github/workflows/app-builds.yml' || run.conclusion !== 'success') {
              throw new Error('Expected a successful isolated App builds candidate');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('version', run.run_number);
      - uses: actions/checkout@v4
        if: inputs.candidate_run_id != ''
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate-source
      - uses: actions/download-artifact@v4
        if: inputs.candidate_run_id != ''
        with:
          name: party-game-store-builds
          path: candidate-build
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Compare production source
        if: inputs.candidate_run_id != ''
        run: |
          git ls-tree -r HEAD android/app android/build.gradle android/settings.gradle party-game > current-source.txt
          git -C candidate-source ls-tree -r HEAD android/app android/build.gradle android/settings.gradle party-game > candidate-source.txt
          cmp current-source.txt candidate-source.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test minified game on phone and tablet
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_SIGNED_APK: ${{ inputs.candidate_run_id != '' && 'candidate-build/apk/release/app-release.apk' || '' }}
          QA_VERSION_CODE: ${{ steps.candidate.outputs.version }}
        with:
          api-level: 35
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash qa/android/run-device-qa.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-qa-${{ matrix.profile }}
          path: |
            android/deviceqa/build/reports/androidTests/
            android/deviceqa/build/outputs/androidTest-results/
            android/app/build/outputs/mapping/qa/
            qa-output/android/
          if-no-files-found: warn
