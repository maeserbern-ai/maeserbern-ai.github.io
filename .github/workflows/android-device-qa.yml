name: Isolated Android Device QA
on:
  push:
    branches: [codex/ingredient-apple-simulator-qa-20261015]
    paths: [android/**, qa/android/**, .github/workflows/android-device-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, Nexus 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test minified game on phone and tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash qa/android/run-device-qa.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-qa-${{ matrix.profile }}
          path: |
            android/deviceqa/build/reports/androidTests/
            android/deviceqa/build/outputs/androidTest-results/
            android/app/build/outputs/mapping/qa/
            qa-output/android/
          if-no-files-found: warn
