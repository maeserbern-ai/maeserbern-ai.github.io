# Builds the app files for every store from the party-game folder:
# Android (phones, Google TV / Android TV, Fire TV), LG TV and Samsung TV.
# Builds from the main branch are also published, permanently, on the
# repository's Releases page ("Party game app files").
name: App builds

on:
  push:
    branches-ignore: ["codex/ingredient-apple-simulator-qa-*"]
    paths:
      - "android/**"
      - "party-game/**"
      - "apple-app/**"
      - ".github/workflows/app-builds.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # One secret holds the whole upload key: "password:base64-keystore".
      UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEY }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Optional: sign store builds with your upload key (see android/README.md).
      - name: Load upload key
        if: ${{ env.UPLOAD_KEY != '' || env.KEYSTORE_BASE64 != '' }}
        run: |
          if [ -n "$UPLOAD_KEY" ]; then
            pass="${UPLOAD_KEY%%:*}"
            echo "$UPLOAD_KEY" | tr -d ' \r\n' | cut -d: -f2- | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "::add-mask::$pass"
            { echo "ANDROID_KEYSTORE_PASSWORD=$pass"; echo "ANDROID_KEY_PASSWORD=$pass"; echo "ANDROID_KEY_ALIAS=upload"; } >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            { echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"; echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"; } >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android --no-daemon assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: party-game-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: party-game-store-builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  tv-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Copy only what the TV apps need.
      - name: Prepare files
        run: |
          mkdir -p tv out
          cp -r party-game tv/lg
          cp -r party-game tv/samsung
          rm -f tv/*/TV-STORES.md tv/*/sw.js tv/*/manifest.webmanifest
          rm -f tv/lg/config.xml tv/lg/icon-samsung.png tv/samsung/appinfo.json

      - name: LG webOS package (.ipk)
        run: npx --yes -p @webos-tools/cli@3 ares-package --no-minify -o out tv/lg

      # Samsung signs the final package with your Samsung certificates in Tizen
      # Studio; this zip is the app ready for that step (see party-game/TV-STORES.md).
      - name: Samsung Tizen app (unsigned .wgt)
        run: (cd tv/samsung && zip -qr ../../out/IngredientPartyGame-samsung-unsigned.wgt .)

      - uses: actions/upload-artifact@v4
        with:
          name: party-game-tv-packages
          path: out/*

  # Keeps a permanent copy of the latest app files on the Releases page
  # (build downloads above expire; releases don't). Only for the main branch.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, tv-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the files clearly
        run: |
          mkdir out
          pick() { find "artifacts/$1" -type f -name "$2" | head -n 1; }
          cp "$(pick party-game-test-apk '*.apk')" out/PartyGame-Android-test.apk
          cp "$(pick party-game-store-builds '*.aab')" out/PartyGame-GooglePlay.aab
          cp "$(pick party-game-store-builds '*.apk')" out/PartyGame-Amazon-FireTV.apk
          cp "$(pick party-game-tv-packages '*.ipk')" out/PartyGame-LG.ipk
          cp "$(pick party-game-tv-packages '*.wgt')" out/PartyGame-Samsung-unsigned.wgt
          (cd android/store && zip -q ../../out/PartyGame-StorePictures.zip *)
          ls -la out

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Latest app files for Ingredient Dictionary: The Party Game (build ${{ github.run_number }}). Install steps: party-game/TV-STORES.md and android/README.md."
          if gh release view party-game-apps >/dev/null 2>&1; then
            gh release edit party-game-apps --notes "$notes"
            gh release upload party-game-apps out/* --clobber
          else
            gh release create party-game-apps out/* --target "${{ github.sha }}" --title "Party game app files" --notes "$notes"
          fi
