# Builds the app files for every store from the party-game folder:
# Android (phones, Google TV / Android TV, Fire TV), LG TV and Samsung TV.
# Download the results from the run's "Artifacts".
name: App builds

on:
  push:
    paths:
      - "android/**"
      - "party-game/**"
      - "apple-app/**"
      - ".github/workflows/app-builds.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Optional: sign store builds with your upload key (see android/README.md).
      - name: Load upload key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: party-game-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: party-game-store-builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  tv-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Copy only what the TV apps need.
      - name: Prepare files
        run: |
          mkdir -p tv/lg tv/samsung out
          rsync -a --exclude TV-STORES.md --exclude config.xml --exclude icon-samsung.png --exclude sw.js --exclude manifest.webmanifest party-game/ tv/lg/
          rsync -a --exclude TV-STORES.md --exclude appinfo.json --exclude sw.js --exclude manifest.webmanifest party-game/ tv/samsung/

      - name: LG webOS package (.ipk)
        run: npx --yes @webos-tools/cli@3 ares-package --no-minify -o out tv/lg

      # Samsung signs the final package with your Samsung certificates in Tizen
      # Studio; this zip is the app ready for that step (see party-game/TV-STORES.md).
      - name: Samsung Tizen app (unsigned .wgt)
        run: (cd tv/samsung && zip -qr ../../out/IngredientPartyGame-samsung-unsigned.wgt .)

      - uses: actions/upload-artifact@v4
        with:
          name: party-game-tv-packages
          path: out/*
