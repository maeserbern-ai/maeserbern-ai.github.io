name: Isolated Apple Simulator QA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Simulator platform to verify
        type: choice
        options: [both, ios, tvos]
        default: both

permissions:
  contents: read

jobs:
  simulator:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["ios","tvos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      QA_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare simulator tooling
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          command -v xcodegen || brew install xcodegen
      - name: Build and test actual app screens
        run: bash qa/apple/run-simulator-qa.sh
      - name: Preserve screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingredient-game-${{ matrix.platform }}-simulator-qa
          path: qa-output/
          retention-days: 14
          if-no-files-found: error
