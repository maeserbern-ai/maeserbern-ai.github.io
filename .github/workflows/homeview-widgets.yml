# "Label of the Day" widgets: iOS (WidgetKit, also shown by Apple HomeView, StandBy and
# the Lock Screen) and Android (Jetpack Glance). Builds and checks only; never signs,
# uploads or submits anything.
name: HomeView widgets

on:
  push:
    branches: [homeview-widgets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Widget data matches the game's puzzles and book links
        run: python3 widgets/export-widget-data.py --check
      - name: Widget QR codes open the right Amazon pages
        run: |
          mkdir -p "$RUNNER_TEMP/qr" && cd "$RUNNER_TEMP/qr" && npm init -y >/dev/null && npm i jsqr@1.4.0 sharp@0.34.4 >/dev/null
          cd "$GITHUB_WORKSPACE" && node qa/widgets/check-widget-qr.cjs "$RUNNER_TEMP/qr/node_modules"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build app, store bundle (unsigned here) and widget tests
        run: gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease
      - name: Check version and widget in the bundle
        run: |
          mkdir -p qa-output/android
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -n 1)
          $AAPT dump badging android/app/build/outputs/apk/release/*.apk | tee qa-output/android/badging.txt | head -n 3
          grep -q "versionCode='23'" qa-output/android/badging.txt
          grep -q "versionName='1.1'" qa-output/android/badging.txt
          $AAPT dump xmltree --file AndroidManifest.xml android/app/build/outputs/apk/release/*.apk > qa-output/android/manifest.txt
          grep -q 'android.appwidget.provider' qa-output/android/manifest.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render widget previews and tap the book link on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash qa/widgets/android/run-widget-qa.sh
      - name: Preserve previews and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-widget-previews
          path: qa-output/android/
          if-no-files-found: warn

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tools
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
      - name: Build app with widget, render snapshots, test book links
        run: bash qa/widgets/ios/run-widget-qa.sh
      - name: Preserve snapshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-widget-snapshots
          path: qa-output/ios/
          if-no-files-found: warn
