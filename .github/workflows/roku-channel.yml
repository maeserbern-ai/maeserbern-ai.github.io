# Roku channel for Ingredient Dictionary The Party Game.
# Checks the BrightScript (BrighterScript compiler + bslint), checks that the
# game data matches party-game/, and zips the channel for sideloading on a
# Roku in Developer Mode. The store upload itself must be a .pkg made on that
# Roku (Packager page) - see roku-channel/README.md.
name: Roku channel

on:
  push:
    branches: [roku-channel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roku-channel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: roku-channel/package-lock.json

      - name: Install BrightScript tools
        run: npm ci --ignore-scripts

      - name: BrightScript static check (bsc + bslint)
        run: npx bsc --project bsconfig.json

      - name: Game data matches party-game/
        run: |
          node tools/build-data.js
          git diff --exit-code -- data/game.json

      - name: Zip the channel
        run: |
          rm -f ingredient-party-game-roku.zip
          zip -r -X ingredient-party-game-roku.zip manifest source components images fonts data sounds
          unzip -l ingredient-party-game-roku.zip | tail -1
          size=$(stat -c %s ingredient-party-game-roku.zip)
          echo "Zip size: $size bytes"
          # Roku sideload/package size limit is 4 MB on many devices; keep well under it.
          if [ "$size" -gt 4000000 ]; then echo "::error::Channel zip is over 4 MB"; exit 1; fi
          grep -q '^ui_resolutions=fhd' manifest
          grep -q '^major_version=' manifest

      - uses: actions/upload-artifact@v4
        with:
          name: ingredient-party-game-roku
          path: roku-channel/ingredient-party-game-roku.zip
          if-no-files-found: error
