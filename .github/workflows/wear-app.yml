# Builds the Galaxy Watch / Wear OS app (wear-app/) of
# "Ingredient Dictionary The Party Game": a signed Play-ready .aab for the
# Wear OS form factor of the existing Play listing, plus a debug .apk to
# side-load on a watch. Nothing is uploaded to any store.
name: Wear OS app

on:
  push:
    branches: [galaxy-watch]
    paths:
      - "wear-app/**"
      - "party-game/**"
      - ".github/workflows/wear-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Same upload key as the phone/TV app: "password:base64-keystore".
      UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEY }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Puzzles, glossary, book links, covers and QR codes come from party-game/.
      - name: Export game data
        run: node wear-app/scripts/export-data.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Load upload key
        if: ${{ env.UPLOAD_KEY != '' || env.KEYSTORE_BASE64 != '' }}
        run: |
          if [ -n "$UPLOAD_KEY" ]; then
            pass="${UPLOAD_KEY%%:*}"
            echo "::add-mask::$pass"
            echo "$UPLOAD_KEY" | tr -d ' \r\n' | cut -d: -f2- | base64 -d > "$RUNNER_TEMP/upload.jks"
            { echo "ANDROID_KEYSTORE_PASSWORD=$pass"; echo "ANDROID_KEY_PASSWORD=$pass"; echo "ANDROID_KEY_ALIAS=upload"; } >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            { echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"; echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"; } >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        run: gradle -p wear-app --no-daemon assembleDebug bundleRelease

      - name: Name the files and check signing
        run: |
          mkdir -p out
          cp "$(find wear-app/app/build/outputs/bundle/release -name '*.aab' | head -n 1)" out/wear-app-release.aab
          cp "$(find wear-app/app/build/outputs/apk/debug -name '*.apk' | head -n 1)" out/wear-debug.apk
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            # Prints only the certificate owner and fingerprint, never secrets.
            keytool -printcert -jarfile out/wear-app-release.aab | grep -E "Owner:|SHA256:" | head -n 2 || true
            echo "Release bundle is signed with the upload key."
          else
            echo "::warning::No upload key secret available; the release bundle is UNSIGNED."
          fi
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt2" dump badging out/wear-debug.apk | grep -E "package:|sdkVersion|targetSdkVersion|uses-feature" || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: wear-app-release
          path: out/wear-app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: out/wear-debug.apk
