plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

// Signing for store uploads comes from environment variables (GitHub secrets).
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "io.github.maeserbern.ingredientpartygame"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.maeserbern.ingredientpartygame"
        minSdk 23
        targetSdk 36
        // Play has versionCode 22 (1.0); the widget update is 1.1 / 23 or later.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "23")
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath) signingConfig signingConfigs.release
        }
        qa {
            initWith release
            signingConfig signingConfigs.debug
            debuggable true
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }

    // The game itself is the website's party-game folder, bundled so it works offline.
    sourceSets {
        main {
            assets.srcDirs = ["../../party-game"]
        }
    }
    // TV-store packaging files from the folder aren't needed inside the app.
    androidResources {
        ignoreAssetsPattern "!*.md:!config.xml:!appinfo.json:!sw.js:!manifest.webmanifest:!.*"
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Keeps the Kotlin runtime pulled in by AndroidX on one version.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:2.1.21")
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.activity:activity:1.9.3"
    // "Label of the Day" home-screen widget.
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Renders the widget previews on an emulator (widgets workflow).
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
